murel_hel_N_value =  4.0 0.4
murel_hel_rhoEN = 0



### 1. Weight with one lens apparent magnitude and two colors, which are obtained from high-resolution imaging; 
### 2. the filters used can be changed in cal_weights.py; search for '### change filters here ###'
###    VVV(which Keck is calibrated to), Roman, Euclid, OGLE(which HST is calibrated to), CSST filters are supported;
### 3. but keep in mind to also recalculate Alambda/AV and replace LOOKUP_CCM89_MDWARF_F062_F087_F213 in cal_weights.py when changing filters, 
###    using the code provided alongside in the repo (but throughput curve for the new filters must be provided by user); 
### 4. Three quantities are treated uncorrelated to each other; 
###    finally we need to weight three apparent magnitudes with full covariance matrix
use_Color_F062_F087_lens = True
use_Color_F087_F213_lens = True
use_F213_lens = True

##### 0.5 solar mass, [M/H]=+0.1 #####
Color_F062_F087_lens_value = 3.10 0.05  
Color_F087_F213_lens_value = 3.25 0.04  
F213_lens_value = 20.61 0.03  

[Isochrone Uncertainty]
### intrinsic astrophysical scatter around the CMD position--metallicity relation
### add in quadture
Color_F062_F087_isochrone_uncertainty = 0.05
Color_F087_F213_isochrone_uncertainty = 0.03
# Color_F062_F087_isochrone_uncertainty = 0.001
# Color_F087_F213_isochrone_uncertainty = 0.001




[Binary Lens]
### 1. if binary_lens == True, simulated lens mass is treated as primary lens mass, 
###    binary total mass = Ml*(1+q_sampled), where q_sampled is sampled from N(q_mean, q_err), 
###    and binary total mass is used to calculate thetaE;
### 2. q must be <= 1;
### 3. if the calculated secondary lens mass exceeds the PARSEC isochrone lower mass limit, 
###    the sum of primary and secondary lens flux is considered; 
### 4. s should be normalized to total mass's thetaE. 
binary_lens = False
q_value = 0.00 0.00
s_value = 0.00 0.00



